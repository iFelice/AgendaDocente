<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Border -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" />

  <!-- Main Agenda Book / Binder -->
  <g filter="url(#shadow)">
    <!-- Book Body -->
    <rect x="96" y="80" width="320" height="352" rx="28" fill="#ffffff" />
    
    <!-- Spine / Binding Left -->
    <path d="M 96 108 C 96 92.5 108.5 80 124 80 L 152 80 L 152 432 L 124 432 C 108.5 432 96 419.5 96 404 Z" fill="#065f46" />
    
    <!-- Spine Rings / Binder holes -->
    <circle cx="152" cy="140" r="10" fill="#f3f4f6" stroke="#047857" stroke-width="4" />
    <circle cx="152" cy="216" r="10" fill="#f3f4f6" stroke="#047857" stroke-width="4" />
    <circle cx="152" cy="296" r="10" fill="#f3f4f6" stroke="#047857" stroke-width="4" />
    <circle cx="152" cy="372" r="10" fill="#f3f4f6" stroke="#047857" stroke-width="4" />

    <!-- Ribbon Bookmark -->
    <path d="M 330 80 L 330 200 L 350 180 L 370 200 L 370 80 Z" fill="url(#goldGrad)" />

    <!-- Calendar Grid / Clock Icon on Page -->
    <!-- Month Header line -->
    <rect x="184" y="130" width="120" height="12" rx="6" fill="#047857" />
    <rect x="184" y="154" width="70" height="8" rx="4" fill="#9ca3af" />

    <!-- Timetable / Grid lines -->
    <g fill="#e5e7eb">
      <!-- Row 1 -->
      <rect x="184" y="190" width="34" height="34" rx="8" />
      <rect x="228" y="190" width="34" height="34" rx="8" />
      <rect x="272" y="190" width="34" height="34" rx="8" fill="#d1fae5" />
      
      <!-- Row 2 -->
      <rect x="184" y="234" width="34" height="34" rx="8" fill="#fef3c7" />
      <rect x="228" y="234" width="34" height="34" rx="8" fill="#d1fae5" />
      <rect x="272" y="234" width="34" height="34" rx="8" />

      <!-- Row 3 -->
      <rect x="184" y="278" width="34" height="34" rx="8" />
      <rect x="228" y="278" width="34" height="34" rx="8" fill="#fee2e2" />
      <rect x="272" y="278" width="34" height="34" rx="8" />
    </g>

    <!-- Inclusion Heart / Support badge (Docente di Sostegno & Didattica) -->
    <g transform="translate(230, 330)">
      <rect x="0" y="0" width="140" height="48" rx="24" fill="#047857" />
      <text x="70" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">SOSTEGNO</text>
    </g>
  </g>
</svg>
